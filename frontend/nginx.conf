server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA — toutes les routes reviennent sur index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache agressif pour les assets buildés (hash dans le nom de fichier)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Pas de cache sur index.html pour que les mises à jour soient immédiates
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Compression gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
